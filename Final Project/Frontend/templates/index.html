<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RideWise - Bike Rental Forecast</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
    body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: url("{{ url_for('static', filename='bike.jpeg') }}") no-repeat center center fixed;
        background-size: cover;
    }

    .container {
        width: 95%;
        max-width: 1200px;
        margin: 30px auto;
        background: rgba(255, 255, 255, 0.95);
        padding: 30px;
        border-radius: 14px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
</style>

</head>
<body>

<div class="container">

    <!-- Hour / Day Toggle -->
    <div class="toggle">
        <button id="hourBtn" class="active" onclick="setMode('hour')">Hour</button>
        <button id="dayBtn" onclick="setMode('day')">Day</button>
    </div>

    <h1>RideWise: Bike Rental Forecast</h1>

    <!-- Input Section -->
    <div class="form-row">
        <input type="date" id="date" required>
        <input type="number" id="temp" placeholder="Temperature (°C)" required>
        <input type="number" id="humidity" placeholder="Humidity (%)" required>
        <input type="number" id="wind" placeholder="Wind Speed (km/h)" required>

        <select id="event">
            <option value="0">No Urban Event</option>
            <option value="1">Urban Event</option>
        </select>

        <button onclick="predict()">Predict</button>
    </div>

    <!-- Output Section -->
    <div class="output" id="output">
        <h3 id="title"></h3>
        <div class="bars" id="bars"></div>
    </div>

</div>

<script>
let mode = "hour";

function setMode(selectedMode) {
    mode = selectedMode;
    document.getElementById("hourBtn").classList.remove("active");
    document.getElementById("dayBtn").classList.remove("active");
    document.getElementById(selectedMode + "Btn").classList.add("active");
}

function predict() {
    fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            mode: mode,
            temp: document.getElementById("temp").value,
            humidity: document.getElementById("humidity").value,
            wind: document.getElementById("wind").value,
            event: document.getElementById("event").value
        })
    })
    .then(response => response.json())
    .then(data => drawGraph(data));
}

function drawGraph(data) {
    const output = document.getElementById("output");
    const bars = document.getElementById("bars");
    const title = document.getElementById("title");

    bars.innerHTML = "";
    output.style.display = "block";

    title.innerText =
        data.mode === "hour"
        ? "Bike Rental Forecast for Next 6 Hours"
        : "Bike Rental Forecast for Next 6 Days";

    const maxValue = Math.max(...data.values);
    const maxHeight = 220;

    data.values.forEach(value => {
        const bar = document.createElement("div");
        bar.className = "bar";

        const height = maxValue === 0 ? 0 : (value / maxValue) * maxHeight;
        bar.style.height = height + "px";

        bar.innerHTML = `<span>${value}</span>`;
        bars.appendChild(bar);
    });
}
</script>

</body>
</html>
